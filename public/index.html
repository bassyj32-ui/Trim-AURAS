<script>
// --- State ---
let templates = [];
let currentJobId = null;
let pollTimer = null;
let drawerJobId = null;
let drawerClips = [];
let drawerClipIndex = 0;
let selectedClip = null;
let selectedFile = null;
let campaignRules = '';
let maxClips = 5;

// Template gradient mapping
const templateGradients = {
  'blurpad_v1': 'linear-gradient(155deg,#E7B5A0,#C97B57)',
  'brand_bold_v1': 'linear-gradient(155deg,#8FA8C9,#4E6E96)',
  'gaming_neon_v1': 'linear-gradient(155deg,#B8C98F,#748C4E)',
  'retro_vhs_v1': 'linear-gradient(155deg,#D9B7E0,#9C6BA8)',
  'mrbeast_energy_v1': 'linear-gradient(155deg,#E8C778,#9C7530)',
  'podcast_split_v1': 'linear-gradient(155deg,#8FC9BE,#4E9688)'
};

// --- DOM ---
const urlInput = document.getElementById('urlInput');
const fileInput = document.getElementById('fileInput');
const uploadZone = document.getElementById('uploadZone');
const uploadIcon = document.getElementById('uploadIcon');
const uploadText = document.getElementById('uploadText');
const uploadCheck = document.getElementById('uploadCheck');
const uploadClear = document.getElementById('uploadClear');
const templateList = document.getElementById('templateList');
const templateCount = document.getElementById('templateCount');
const generateBtn = document.getElementById('generateBtn');
const progressWrap = document.getElementById('progressWrap');
const progressFill = document.getElementById('progressFill');
const progressStatus = document.getElementById('progressStatus');
const progressPct = document.getElementById('progressPct');
const historyEl = document.getElementById('historyList');
const vaultCount = document.getElementById('vaultCount');
const drawerOverlay = document.getElementById('drawerOverlay');
const drawer = document.getElementById('drawer');
const clipVideo = document.getElementById('clipVideo');
const clipNav = document.getElementById('clipNav');
const titleText = document.getElementById('titleText');
const clipMeta = document.getElementById('clipMeta');
const titleTabs = document.getElementById('titleTabs');
const copyTitleBtn = document.getElementById('copyTitleBtn');
const copyHashtagsBtn = document.getElementById('copyHashtagsBtn');
const refreshSeoBtn = document.getElementById('refreshSeoBtn');
const downloadBtn = document.getElementById('downloadBtn');
const toast = document.getElementById('toast');
const settingsBtn = document.getElementById('settingsBtn');
const settingsOverlay = document.getElementById('settingsOverlay');
const settingsModal = document.getElementById('settingsModal');
const modalClose = document.getElementById('modalClose');
const modalCancel = document.getElementById('modalCancel');
const modalConfirm = document.getElementById('modalConfirm');
const campaignRulesInput = document.getElementById('campaignRulesInput');
const maxClipsSlider = document.getElementById('maxClipsSlider');
const maxClipsValue = document.getElementById('maxClipsValue');

// --- File Upload UI ---
uploadZone.addEventListener('click', (e) => {
  if (e.target === uploadZone || e.target.closest('.upload-icon') || e.target.closest('.upload-filename')) {
    fileInput.click();
  }
});
uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('dragover'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop', (e) => {
  e.preventDefault();
  uploadZone.classList.remove('dragover');
  if (e.dataTransfer.files.length) {
    fileInput.files = e.dataTransfer.files;
    handleFileSelect(e.dataTransfer.files[0]);
  }
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) handleFileSelect(fileInput.files[0]);
});

function handleFileSelect(file) {
  selectedFile = file;
  uploadText.textContent = file.name;
  uploadCheck.style.display = 'flex';
  uploadClear.style.display = 'flex';
  uploadZone.classList.add('has-file');
  urlInput.value = '';
}

// --- Upload Clear ---
uploadClear.addEventListener('click', (e) => {
  e.stopPropagation();
  clearUpload();
});

function clearUpload() {
  selectedFile = null;
  uploadText.textContent = 'Drop your video here or tap to browse';
  uploadCheck.style.display = 'none';
  uploadClear.style.display = 'none';
  uploadZone.classList.remove('has-file');
  fileInput.value = '';
}

// --- Animated Counters ---
document.querySelectorAll('.stat-num[data-count]').forEach(el => {
  const target = parseInt(el.dataset.count, 10);
  const suffix = el.dataset.suffix || '';
  const duration = 900;
  const startDelay = 300;
  const startTime = performance.now() + startDelay;
  function tick(now) {
    const t = Math.min(1, Math.max(0, (now - startTime) / duration));
    const eased = 1 - Math.pow(1 - t, 3);
    const val = Math.round(target * eased);
    el.textContent = val.toLocaleString() + suffix;
    if (t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
});

// --- Settings Modal ---
function openSettings() {
  campaignRulesInput.value = campaignRules;
  maxClipsSlider.value = maxClips;
  maxClipsValue.textContent = maxClips;
  settingsOverlay.classList.add('open');
  settingsModal.classList.add('open');
}

function closeSettings() {
  settingsOverlay.classList.remove('open');
  settingsModal.classList.remove('open');
}

settingsBtn.addEventListener('click', openSettings);
settingsOverlay.addEventListener('click', closeSettings);
modalClose.addEventListener('click', closeSettings);
modalCancel.addEventListener('click', closeSettings);

maxClipsSlider.addEventListener('input', () => {
  maxClipsValue.textContent = maxClipsSlider.value;
});

modalConfirm.addEventListener('click', () => {
  campaignRules = campaignRulesInput.value.trim();
  maxClips = parseInt(maxClipsSlider.value);
  closeSettings();
  showToast('Settings saved: ' + maxClips + ' clips max');
});

// --- Templates ---
function getTemplateEmoji(id) {
  const map = {
    'blurpad_v1': '🎬',
    'podcast_split_v1': '🎙️',
    'retro_vhs_v1': '📼',
    'gaming_neon_v1': '🎮',
    'mrbeast_energy_v1': '🔥',
    'brand_bold_v1': '💼'
  };
  return map[id] || '🎬';
}

async function loadTemplates() {
  try {
    const res = await fetch('/api/templates');
    templates = await res.json();
  } catch(e) {
    templateList.innerHTML = '<div style="color:var(--red);font-size:13px;padding:20px;text-align:center">Could not reach the server. Make sure the backend is running.</div>';
    return;
  }
  templateList.innerHTML = templates.map((t,i) =>
    `<div class="thumb${i===0?' active':''}" data-id="${t.id}" style="background:${templateGradients[t.id]||'linear-gradient(155deg,#E7B5A0,#C97B57)'}">
      <span class="thumb-emoji">${getTemplateEmoji(t.id)}</span>
      <div class="thumb-label">${t.name}</div>
    </div>`
  ).join('');
  templateCount.textContent = '01 / ' + String(templates.length).padStart(2,'0');
  const thumbs = templateList.querySelectorAll('.thumb');
  thumbs.forEach(el => {
      el.addEventListener('click', () => {
        thumbs.forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        const idx = [...el.parentNode.children].indexOf(el);
        templateCount.textContent = String(idx + 1).padStart(2,'0') + ' / ' + String(templates.length).padStart(2,'0');
        el.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
        updatePreview(el.dataset.id, el.querySelector('.thumb-label').textContent, el.style.background);
      });
    });
  // Update counter on scroll
  templateList.addEventListener('scroll', () => {
    const containerRect = templateList.getBoundingClientRect();
    const centerX = containerRect.left + containerRect.width / 2;
    let closest = null;
    let closestDist = Infinity;
    templateList.querySelectorAll('.thumb').forEach((el, i) => {
      const r = el.getBoundingClientRect();
      const dist = Math.abs(r.left + r.width / 2 - centerX);
      if (dist < closestDist) { closestDist = dist; closest = i; }
    });
    if (closest !== null) {
      templateCount.textContent = String(closest + 1).padStart(2,'0') + ' / ' + String(templates.length).padStart(2,'0');
    }
  });

  // Init preview with first template
  const first = thumbs[0];
  if (first) updatePreview(first.dataset.id, first.querySelector('.thumb-label').textContent, first.style.background);
}

function updatePreview(id, name, gradient) {
  // Update body tint
  document.body.setAttribute('data-template', id);
  // The preview element may not exist anymore, that's fine
  const el = document.getElementById('previewVisual');
  if (el) {
    el.style.background = gradient;
    el.innerHTML = `<div class="preview-name">${escHtml(name)}</div><div class="preview-desc">${getTemplateDesc(id)}</div>`;
  }
}

function getTemplateDesc(id) {
  const map = {
    'blurpad_v1': 'Soft blurred background with clean overlays',
    'brand_bold_v1': 'Professional brand-focused layout',
    'gaming_neon_v1': 'Vibrant gaming aesthetic with neon accents',
    'retro_vhs_v1': 'Retro VHS-inspired vintage look',
    'mrbeast_energy_v1': 'High-energy cinematic style',
    'podcast_split_v1': 'Split-screen podcast format'
  };
  return map[id] || '';
}

// --- Vault / History ---
async function loadHistory() {
  try {
    const [jobsRes, clipsRes] = await Promise.all([
      fetch('/api/jobs'),
      fetch('/api/clips')
    ]);
    if (!jobsRes.ok || !clipsRes.ok) throw new Error('API unavailable');
    const jobs = await jobsRes.json();
    const clips = await clipsRes.json();

    const pendingCount = jobs.filter(j => j.status !== 'COMPLETED' && j.status !== 'FAILED').length;
    vaultCount.textContent = pendingCount + ' pending';

    if (jobs.length === 0) {
      historyEl.innerHTML = `<div class="vault-empty">
        <span class="vault-empty-icon">🎬</span>
        <p class="vault-empty-title">Welcome to TrimAURA</p>
        <p class="vault-empty-desc">Upload a video or paste a Google Drive URL, pick a template, and generate shorts with AI-powered captions and SEO.</p>
        <div class="vault-empty-steps">
          <div class="vault-step"><span class="vault-step-num">1</span> Add your video</div>
          <div class="vault-step"><span class="vault-step-num">2</span> Pick a template</div>
          <div class="vault-step"><span class="vault-step-num">3</span> Generate &amp; share</div>
        </div>
      </div>`;
      return;
    }

    historyEl.innerHTML = jobs.map(j => {
      const isCompleted = j.status === 'COMPLETED';
      const jobClips = clips.filter(c => c.job_id === j.job_id);
      const gradient = templateGradients[j.template_id] || 'linear-gradient(155deg,#E7B5A0,#C97B57)';
      return `
      <div class="vault-item" data-id="${j.job_id}">
        <div class="vault-thumb" style="background:${gradient}"></div>
        <div class="vault-body">
          <div class="vault-name">${escHtml(j.title)}</div>
          <div class="vault-meta-row">
            <div class="vault-meta">
              <svg class="icon" width="10" height="10" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
              ${j.clips_count} clip${j.clips_count!==1?'s':''}
            </div>
            <div class="vault-meta">${timeAgo(j.created_at)}</div>
          </div>
        </div>
        ${isCompleted ? `
        <div class="vault-actions">
          <button class="vault-action vault-view" data-id="${j.job_id}">
            <svg class="icon" width="12" height="12" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <span class="vault-action-label">View</span>
          </button>
          <button class="vault-action vault-download-all" data-id="${j.job_id}">
            <svg class="icon" width="12" height="12" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span class="vault-action-label">All</span>
          </button>
          <button class="vault-action vault-generate" data-id="${j.job_id}">
            <svg class="icon" width="12" height="12" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span class="vault-action-label">More</span>
          </button>
        </div>` : `<span class="vault-status vault-status-${j.status}">${j.status}</span>`}
      </div>`;
    }).join('');

    // Wire history item click = open drawer
    historyEl.querySelectorAll('.vault-item').forEach(el => {
      el.addEventListener('click', (e) => {
        if (e.target.closest('.vault-action')) return;
        openDrawer(parseInt(el.dataset.id));
      });
    });

    // Wire vault buttons
    historyEl.querySelectorAll('.vault-view').forEach(b => {
      b.addEventListener('click', (e) => { e.stopPropagation(); openDrawer(parseInt(b.dataset.id)); });
    });
    historyEl.querySelectorAll('.vault-download-all').forEach(b => {
      b.addEventListener('click', (e) => { e.stopPropagation(); downloadAllClips(parseInt(b.dataset.id)); });
    });
    historyEl.querySelectorAll('.vault-generate').forEach(b => {
      b.addEventListener('click', (e) => { e.stopPropagation(); generateMore(parseInt(b.dataset.id)); });
    });

  } catch(e) {
    historyEl.innerHTML = '<div style="color:var(--red);font-size:13px;text-align:center;padding:20px">Could not reach the server. Make sure the backend is running.</div>';
  }
}

// --- Generate More ---
async function generateMore(jobId) {
  if (!confirm('Generate 3 more clips from this video?')) return;
  showToast('Generating more clips...');
  currentJobId = jobId;
  try {
    await fetch(`/api/jobs/${jobId}/generate-more`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({count: 3})
    });
    progressWrap.classList.add('active');
    setProgress('ANALYZING', 0);
    startPolling(jobId);
  } catch {
    showToast('Failed to start generation');
  }
}

// --- Download All ---
async function downloadAllClips(jobId) {
  try {
    const res = await fetch(`/api/jobs/${jobId}`);
    const job = await res.json();
    for (const c of job.clips) {
      await downloadSingleClip(c.clip_id);
    }
    showToast('Downloads started');
  } catch {
    showToast('Download failed');
  }
}

// --- Submit Job ---
generateBtn.addEventListener('click', async () => {
  const templateId = templateList.querySelector('.thumb.active')?.dataset.id || 'blurpad_v1';
  const hasFile = selectedFile !== null;
  const url = urlInput.value.trim();

  if (!hasFile && !url) { showToast('Select a file or enter a Google Drive URL'); return; }

  generateBtn.disabled = true;
  generateBtn.textContent = 'Processing...';
  progressWrap.classList.add('active');
  setProgress('PENDING', 0);

  try {
    let res;
    if (hasFile) {
      const form = new FormData();
      form.append('file', selectedFile);
      form.append('template_id', templateId);
      form.append('campaign_rules', campaignRules);
      form.append('max_clips', maxClips.toString());
      res = await fetch('/api/jobs/upload', { method: 'POST', body: form });
    } else {
      res = await fetch('/api/jobs', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          title: url.split('/').pop() || 'Untitled',
          source_url: url,
          template_id: templateId,
          campaign_rules: campaignRules,
          max_clips: maxClips
        })
      });
    }
    const data = await res.json();
    currentJobId = data.job_id;
    startPolling(currentJobId);
  } catch(e) {
    showToast('Failed to create job');
    generateBtn.disabled = false;
    generateBtn.textContent = 'Generate shorts';
  }
});

// --- Polling ---
function startPolling(jobId) {
  if (pollTimer) clearInterval(pollTimer);

  pollTimer = setInterval(async () => {
    try {
      const res = await fetch(`/api/jobs/${jobId}/poll`);
      if (!res.ok) return;
      const data = await res.json();
      setProgress(data.status, data.progress);

      if (data.status === 'COMPLETED') {
        clearInterval(pollTimer);
        pollTimer = null;
        generateBtn.disabled = false;
        generateBtn.textContent = 'Generate shorts';
        progressWrap.classList.remove('active');
        clearUpload();
        loadHistory();
        showToast('Shorts generated!');
      }
      if (data.status === 'FAILED') {
        clearInterval(pollTimer);
        pollTimer = null;
        generateBtn.disabled = false;
        generateBtn.textContent = 'Generate shorts';
        showToast('Failed: ' + (data.error || 'Unknown error'));
      }
    } catch(e) {
      // Silently retry
    }
  }, 2000);
}

function setProgress(status, pct) {
  progressFill.style.width = pct + '%';
  progressStatus.textContent = status;
  progressPct.textContent = pct + '%';
}

// --- Drawer ---
async function openDrawer(jobId) {
  try {
    const res = await fetch(`/api/jobs/${jobId}`);
    const job = await res.json();
    const clips = job.clips;
    if (clips.length === 0) { showToast('No clips available'); return; }

    drawerJobId = jobId;
    drawerClips = clips;
    drawerClipIndex = 0;

    renderClipNav();
    selectClip(0);
    drawerOverlay.classList.add('open');
    drawer.classList.add('open');
    document.body.style.overflow = 'hidden';
  } catch(e) {
    showToast('Failed to load clip');
  }
}

function renderClipNav() {
  clipNav.innerHTML = drawerClips.map((c, i) =>
    `<button class="clip-dot${i===0?' active':''}" data-index="${i}">${i+1}</button>`
  ).join('');
  clipNav.querySelectorAll('.clip-dot').forEach(el => {
    el.addEventListener('click', () => selectClip(parseInt(el.dataset.index)));
  });
}

function selectClip(index) {
  drawerClipIndex = index;
  selectedClip = drawerClips[index];
  showClip(selectedClip);
  clipNav.querySelectorAll('.clip-dot').forEach((d, i) => {
    d.classList.toggle('active', i === index);
  });
}

function showClip(clip) {
  clipVideo.src = clip.r2_url;
  clipVideo.load();
  setActiveTitle('curiosity');
  updateClipMeta(clip);
  downloadBtn.onclick = () => downloadSingleClip(clip.clip_id);
}

function setActiveTitle(key) {
  const titles = {curiosity: selectedClip.titles.curiosity, direct: selectedClip.titles.direct, question: selectedClip.titles.question};
  titleText.textContent = titles[key] || 'No title';
  document.querySelectorAll('.title-tab').forEach(t => t.classList.toggle('active', t.dataset.key === key));
}

document.querySelectorAll('.title-tab').forEach(tab => {
  tab.addEventListener('click', () => setActiveTitle(tab.dataset.key));
});

function updateClipMeta(clip) {
  clipMeta.textContent = `${clip.duration}s · ${clip.hashtags || ''}`;
}

drawerOverlay.addEventListener('click', closeDrawer);

function closeDrawer() {
  drawerOverlay.classList.remove('open');
  drawer.classList.remove('open');
  document.body.style.overflow = '';
  clipVideo.pause();
}

// --- Refresh SEO ---
refreshSeoBtn.addEventListener('click', async () => {
  if (!selectedClip) return;
  const clipId = selectedClip.clip_id;
  refreshSeoBtn.disabled = true;
  refreshSeoBtn.textContent = 'Refreshing...';
  try {
    const res = await fetch(`/api/clips/${clipId}/refresh-seo`, { method: 'POST' });
    const data = await res.json();
    selectedClip.titles = data.titles;
    selectedClip.description = data.description;
    selectedClip.hashtags = data.hashtags;
    setActiveTitle(document.querySelector('.title-tab.active')?.dataset.key || 'curiosity');
    updateClipMeta(selectedClip);
    showToast('SEO refreshed!');
  } catch {
    showToast('Refresh failed');
  } finally {
    refreshSeoBtn.disabled = false;
    refreshSeoBtn.textContent = 'Refresh SEO';
  }
});

// --- Download ---
async function downloadSingleClip(clipId) {
  try {
    const res = await fetch(`/api/clips/${clipId}/download`);
    const data = await res.json();
    if (data.download_url) {
      const a = document.createElement('a');
      a.href = data.download_url;
      a.download = `trimaura_clip_${clipId}.mp4`;
      a.click();
    }
  } catch {
    showToast('Download failed');
  }
}

// --- Copy ---
copyTitleBtn.addEventListener('click', () => {
  const active = document.querySelector('.title-tab.active');
  const key = active ? active.dataset.key : 'curiosity';
  const text = selectedClip.titles[key] || '';
  copyText(text, 'Title copied!');
});

copyHashtagsBtn.addEventListener('click', () => {
  copyText(selectedClip.hashtags || '', 'Hashtags copied!');
});

async function copyText(text, msg) {
  try {
    await navigator.clipboard.writeText(text);
    showToast(msg);
  } catch {
    showToast('Copy failed');
  }
}

// --- Helpers ---
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

function timeAgo(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  const days = Math.floor(hrs / 24);
  if (days === 1) return 'yesterday';
  if (days < 7) return days + 'd ago';
  return new Date(iso).toLocaleDateString();
}

function escHtml(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

// --- Init ---
loadTemplates();
loadHistory();
setInterval(loadHistory, 10000);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/service-worker.js');
}
</script>
