<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0f10">
<title>TrimAURA Clip</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#0f0f10; color:#f4f1ea; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; overflow-x:hidden; }
  .topbar { width:100%; max-width:560px; display:flex; align-items:center; justify-content:space-between; padding:14px 16px; }
  .brand { font-size:14px; font-weight:800; letter-spacing:0.5px; color:#f4f1ea; }
  .brand span { color:#d8a24a; }
  .player-wrap { width:100%; max-width:480px; padding:0 12px; }
  video { width:100%; aspect-ratio:9/16; background:#000; border-radius:16px; object-fit:cover; }
  .meta { width:100%; max-width:480px; padding:14px 16px 8px; }
  .title { font-size:17px; font-weight:700; line-height:1.35; }
  .sub { font-size:12px; color:#9a968f; margin-top:6px; }
  .actions { width:100%; max-width:480px; display:flex; gap:10px; padding:8px 16px 28px; }
  .actions a, .actions button {
    flex:1; text-align:center; text-decoration:none; border:none; cursor:pointer;
    padding:12px 10px; border-radius:12px; font-size:14px; font-weight:700; font-family:inherit;
    background:#d8a24a; color:#17130d;
  }
  .actions .ghost { background:#26262a; color:#f4f1ea; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:#26262a; color:#f4f1ea; padding:10px 18px; border-radius:999px; font-size:13px;
    opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap; }
  .toast.show { opacity:1; }
  .status { font-size:13px; color:#9a968f; padding:20px; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">TRIM<span>AURA</span></div>
    <div style="font-size:12px;color:#9a968f;">clip viewer</div>
  </div>
  <div class="player-wrap">
    <video id="player" controls playsinline preload="metadata" poster=""></video>
  </div>
  <div class="meta">
    <div class="title" id="title">Loading clip…</div>
    <div class="sub" id="sub"></div>
  </div>
  <div class="actions">
    <button id="copyLinkBtn">Copy Link</button>
    <a id="downloadLink" class="ghost" download>Download MP4</a>
  </div>
  <div class="status" id="status"></div>
  <div class="toast" id="toast"></div>

<script>
  const params = new URLSearchParams(location.search);
  const clipId = params.get('id');
  const base = location.origin;
  const player = document.getElementById('player');
  const titleEl = document.getElementById('title');
  const subEl = document.getElementById('sub');
  const statusEl = document.getElementById('status');
  const downloadLink = document.getElementById('downloadLink');
  const copyLinkBtn = document.getElementById('copyLinkBtn');
  const toastEl = document.getElementById('toast');

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  function playerUrl(id) { return base + '/api/clips/' + id + '/download'; }

  async function load() {
    if (!clipId) {
      statusEl.textContent = 'No clip id in the URL. Try again from the TrimAURA app.';
      return;
    }
    player.src = playerUrl(clipId);
    player.load();
    downloadLink.href = playerUrl(clipId);
    downloadLink.setAttribute('download', 'trimaura-clip-' + clipId + '.mp4');
    copyLinkBtn.onclick = () => {
      navigator.clipboard.writeText(playerUrl(clipId)).then(
        () => showToast('Clip link copied'),
        () => showToast('Copy failed — long-press the link instead')
      );
    };
    // Enrich with title/score from the clips list (best-effort; player works without it)
    try {
      const res = await fetch(base + '/api/clips');
      if (res.ok) {
        const data = await res.json();
        const clips = data.clips || data;
        const clip = (clips || []).find(c => String(c.clip_id) === String(clipId));
        if (clip) {
          titleEl.textContent = clip.titles?.curiosity || clip.title_curiosity || 'Clip ' + clipId;
          const parts = [];
          if (clip.viral_score != null) parts.push('Viral score ' + clip.viral_score + '/100');
          if (clip.duration) parts.push(clip.duration + 's');
          if (clip.hashtags) parts.push(clip.hashtags);
          subEl.textContent = parts.join(' · ');
        }
      }
    } catch (e) { /* title enrichment is optional */ }
    statusEl.textContent = '';
  }

  load();
</script>
</body>
</html>
