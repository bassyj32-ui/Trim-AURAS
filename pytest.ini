[pytest]
# Without this the suite only works when invoked as `python -m pytest`, which
# happens to put the CWD on sys.path. Bare `pytest` — what CI uses — does not,
# and conftest fails with `ModuleNotFoundError: No module named 'app'`.
pythonpath = .
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning