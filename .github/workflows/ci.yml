name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.3
      - name: Ruff check
        run: ruff check app scripts modal_app.py dev_server.py
      - name: Compile all Python
        run: python -m compileall -q app scripts modal_app.py dev_server.py